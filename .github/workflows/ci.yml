name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify
        run: make verify
      - name: Build linux/amd64 OCI image
        run: make image

  postgres-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Start PostgreSQL
        run: |
          podman run --detach --name phantom-postgres \
            --env POSTGRES_USER=phantom \
            --env POSTGRES_PASSWORD=phantom \
            --env POSTGRES_DB=phantom_test \
            --publish 127.0.0.1:5432:5432 \
            docker.io/library/postgres:17-alpine
          for attempt in $(seq 1 30); do
            if podman exec phantom-postgres pg_isready -U phantom -d phantom_test; then
              exit 0
            fi
            sleep 1
          done
          podman logs phantom-postgres
          exit 1
      - name: Run PostgreSQL migration test
        env:
          XUI_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=phantom password=phantom dbname=phantom_test sslmode=disable
        run: go test ./internal/database -run '^TestMigrateSingleMachinePostgres$' -count=1 -v
