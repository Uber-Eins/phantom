name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set system Environment
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          sudo apt-get update
          sudo apt-get install -y podman nginx libnginx-mod-stream
          sudo install -d /etc/nginx/modules
          sudo install -m 0644 \
            /usr/share/nginx/modules-available/mod-stream.conf \
            /etc/nginx/modules/50-mod-stream.conf
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify
        run: make verify
      - name: Build linux/amd64 OCI image
        run: make image
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish dev image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/uber-eins/phantom
        run: |
          podman tag localhost/phantom:verify "$IMAGE:dev"
          podman push "$IMAGE:dev"
